<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuffAI Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0a0c0f;
      --panel: #12161c;
      --line: #2a3340;
      --muted: #8a94a3;
      --soft: #d2d8e0;
      --accent: #c4a574;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      color: var(--soft);
      background: var(--ink);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .shell-top {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.7rem 1.1rem;
      border-bottom: 1px solid var(--line);
      background: rgba(18, 22, 28, 0.96);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }
    .brand-mark {
      width: 34px; height: 34px;
      border-radius: 9px;
      border: 1px solid rgba(196, 165, 116, 0.4);
      background: rgba(196, 165, 116, 0.12);
      display: flex; align-items: center; justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
    }
    .brand h1 {
      margin: 0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
    }
    .brand p {
      margin: 0.1rem 0 0;
      font-size: 11px;
      color: var(--muted);
    }
    .tabs {
      display: flex;
      gap: 0.35rem;
      padding: 0.2rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0e1218;
    }
    .tab {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 0.5rem 1.1rem;
      border-radius: 9px;
      cursor: pointer;
    }
    .tab:hover { color: #fff; }
    .tab.active {
      background: rgba(196, 165, 116, 0.18);
      color: #fff;
    }
    .right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .user {
      font-size: 12px;
      color: var(--muted);
    }
    .user b { color: var(--soft); font-weight: 600; }
    .logout {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .logout:hover { color: #fff; border-color: var(--accent); }
    .frame-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      background: #0a0c0f;
    }
    .frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0a0c0f;
    }
    .frame-wrap iframe.hidden { display: none; }
  </style>
</head>
<body>
  <script>
    if (localStorage.getItem('suffai_demo_session') !== '1') {
      location.replace('./login.html');
    }
  </script>

  <header class="shell-top">
    <div class="brand">
      <div class="brand-mark">SA</div>
      <div>
        <h1>SuffAI Command Center</h1>
        <p>Geo intelligence · Ads Lab</p>
      </div>
    </div>

    <nav class="tabs" aria-label="Sections">
      <button type="button" class="tab active" data-tab="geo">Geo</button>
      <button type="button" class="tab" data-tab="ads">Ads Lab</button>
    </nav>

    <div class="right">
      <div class="user">Signed in as <b id="userLabel">brand</b></div>
      <button type="button" class="logout" id="btnLogout">Log out</button>
    </div>
  </header>

  <div class="frame-wrap">
    <iframe id="frame-geo" title="Geo" src="./geo.html"></iframe>
    <iframe id="frame-ads" class="hidden" title="Ads Lab" src="./ads_lab.html"></iframe>
  </div>

  <script>
    const user = localStorage.getItem('suffai_demo_user') || 'brand';
    document.getElementById('userLabel').textContent = user;

    const tabs = {
      geo: document.getElementById('frame-geo'),
      ads: document.getElementById('frame-ads')
    };

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.tab;
        document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
        Object.entries(tabs).forEach(([key, frame]) => {
          frame.classList.toggle('hidden', key !== id);
        });
      });
    });

    document.getElementById('btnLogout').addEventListener('click', () => {
      localStorage.removeItem('suffai_demo_session');
      localStorage.removeItem('suffai_demo_user');
      location.href = './login.html';
    });
  </script>
</body>
</html>
