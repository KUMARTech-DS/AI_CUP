<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuffAI Command Center</title>
  <script src="./config.js"></script>
  <script src="./session.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0a0c0f;
      --panel: #12161c;
      --line: #2a3340;
      --muted: #8a94a3;
      --soft: #d2d8e0;
      --accent: #c4a574;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      color: var(--soft);
      background: var(--ink);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .shell-top {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.7rem 1.1rem;
      border-bottom: 1px solid var(--line);
      background: rgba(18, 22, 28, 0.96);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }
    .brand-mark {
      width: 34px; height: 34px;
      border-radius: 9px;
      border: 1px solid rgba(196, 165, 116, 0.4);
      background: rgba(196, 165, 116, 0.12);
      display: flex; align-items: center; justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
    }
    .brand h1 {
      margin: 0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
    }
    .brand p {
      margin: 0.1rem 0 0;
      font-size: 11px;
      color: var(--muted);
    }
    .tabs {
      display: flex;
      gap: 0.35rem;
      padding: 0.2rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0e1218;
    }
    .tab {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 0.5rem 1.1rem;
      border-radius: 9px;
      cursor: pointer;
    }
    .tab:hover { color: #fff; }
    .tab.active {
      background: rgba(196, 165, 116, 0.18);
      color: #fff;
    }
    .right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .user {
      font-size: 12px;
      color: var(--muted);
    }
    .user b { color: var(--soft); font-weight: 600; }
    .logout {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .logout:hover { color: #fff; border-color: var(--accent); }
    .frame-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      background: #0a0c0f;
    }
    .frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0a0c0f;
    }
    .frame-wrap iframe.hidden { display: none; }

    /* Fashion stylist FAB — Geo / Ads only (bottom-right) */
    .chat-fab {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      z-index: 50;
      width: 64px;
      height: 64px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid rgba(196, 165, 116, 0.65);
      background: #1a1510;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }
    .chat-fab img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .chat-fab:hover { border-color: rgba(196, 165, 116, 0.95); transform: scale(1.04); }
    .chat-fab.open {
      background: rgba(196, 165, 116, 0.35);
      color: #fff;
      font-size: 22px;
      font-weight: 600;
      line-height: 60px;
      text-align: center;
    }
    .chat-fab.open img { display: none; }
    .chat-popup {
      display: none;
      position: fixed;
      right: 1.25rem;
      bottom: 5.25rem;
      z-index: 50;
      width: min(360px, calc(100vw - 2rem));
      height: min(480px, calc(100vh - 7rem));
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(18, 22, 28, 0.98);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    body.chat-open .chat-popup { display: flex; }
    .chat-popup-header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }
    .chat-popup-header span {
      display: block;
      margin-top: 0.25rem;
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
    }
    .chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .chat-bubble {
      max-width: 95%;
      padding: 0.65rem 0.75rem;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chat-bubble.user {
      align-self: flex-end;
      background: rgba(196, 165, 116, 0.2);
      border: 1px solid rgba(196, 165, 116, 0.35);
      color: #fff;
    }
    .chat-bubble.assistant {
      align-self: flex-start;
      background: #0e1218;
      border: 1px solid var(--line);
      color: var(--soft);
    }
    .chat-bubble.error {
      border-color: rgba(248, 113, 113, 0.5);
      color: #fca5a5;
    }
    .chat-confirm {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .chat-confirm button {
      flex: 1;
      border-radius: 8px;
      border: 1px solid rgba(196, 165, 116, 0.45);
      background: rgba(196, 165, 116, 0.18);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 0.4rem 0.5rem;
      cursor: pointer;
    }
    .chat-confirm button.secondary {
      background: transparent;
      color: var(--muted);
    }
    .chat-form {
      border-top: 1px solid var(--line);
      padding: 0.75rem;
      display: flex;
      gap: 0.5rem;
    }
    .chat-form input {
      flex: 1;
      background: #0e1218;
      border: 1px solid var(--line);
      color: var(--soft);
      border-radius: 8px;
      padding: 0.55rem 0.7rem;
      font-size: 13px;
      font-family: inherit;
    }
    .chat-form button {
      border: 1px solid rgba(196, 165, 116, 0.45);
      background: rgba(196, 165, 116, 0.2);
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      padding: 0.55rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .chat-form button:disabled { opacity: 0.5; cursor: not-allowed; }
    .chat-form .chat-attach {
      background: transparent;
      padding: 0.55rem 0.65rem;
      font-size: 14px;
      line-height: 1;
    }
    .chat-confirm-box {
      border: 1px solid rgba(196, 165, 116, 0.45);
      border-radius: 10px;
      padding: 0.6rem 0.7rem;
      font-size: 12px;
      color: var(--soft);
    }
    .chat-confirm-box .label {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 10px;
      color: rgba(196, 165, 116, 0.95);
      margin-bottom: 0.25rem;
    }
    .chat-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      padding: 0 0.75rem;
    }
    .chat-chips:empty { display: none; }
    .chat-chips .chip {
      font-size: 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.15rem 0.55rem;
      color: var(--soft);
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-chips .chip.clear {
      cursor: pointer;
      color: var(--muted);
      background: transparent;
    }
  </style>
</head>
<body>
  <header class="shell-top" id="shellTop" style="visibility:hidden">
    <div class="brand">
      <div class="brand-mark">SA</div>
      <div>
        <h1>SuffAI Command Center</h1>
        <p id="shellSubtitle">Geo · Ads Lab · Style · Admin</p>
      </div>
    </div>

    <nav class="tabs" aria-label="Sections">
      <button type="button" class="tab" data-tab="geo" hidden>Geo</button>
      <button type="button" class="tab" data-tab="ads" hidden>Ads Lab</button>
      <button type="button" class="tab" data-tab="campaigns" hidden>Campaigns</button>
      <button type="button" class="tab" data-tab="style" hidden>Style Assistant</button>
      <button type="button" class="tab" data-tab="admin" hidden>Admin</button>
    </nav>

    <div class="right">
      <div class="user">Signed in as <b id="userLabel">…</b></div>
      <button type="button" class="logout" id="btnLogout">Log out</button>
    </div>
  </header>

  <div class="frame-wrap">
    <iframe id="frame-geo" class="hidden" title="Geo" src="about:blank" data-src="./geo.html"></iframe>
    <iframe id="frame-ads" class="hidden" title="Ads Lab" src="about:blank" data-src="./ads_lab.html"></iframe>
    <iframe id="frame-campaigns" class="hidden" title="Campaigns" src="about:blank" data-src="./campaigns.html"></iframe>
    <iframe id="frame-style" class="hidden" title="Style Assistant" src="about:blank" data-src="./style_assistant.html"></iframe>
    <iframe id="frame-admin" class="hidden" title="Admin" src="about:blank" data-src="./admin.html"></iframe>
  </div>

  <!-- AURA brand operating agent (Geo + Ads Lab only — bottom-right) -->
  <button type="button" class="chat-fab" id="chatFab" aria-label="Open AURA agent" aria-pressed="false" style="display:none">
    <img src="./assets/fashion-stylist.svg" alt="" width="64" height="64" />
  </button>
  <aside class="chat-popup" id="chatPopup" aria-label="AURA brand operating agent">
    <div class="chat-popup-header">
      AURA
      <span id="chatCtxHint">Brand operating agent · Geo + Ads Lab</span>
    </div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-chips" id="chatChips" aria-live="polite"></div>
    <form class="chat-form" id="chatForm">
      <button type="button" class="chat-attach" id="chatAttach" title="Attach SKU images" aria-label="Attach SKU images">&#128206;</button>
      <input id="chatFile" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden />
      <input id="chatInput" type="text" maxlength="2000" placeholder="e.g. Find the best PIN for Champions and start a campaign…" autocomplete="off" />
      <button type="submit" id="chatSend">Send</button>
    </form>
  </aside>

  <script>
    const tabs = {
      geo: document.getElementById('frame-geo'),
      ads: document.getElementById('frame-ads'),
      campaigns: document.getElementById('frame-campaigns'),
      style: document.getElementById('frame-style'),
      admin: document.getElementById('frame-admin')
    };

    const chatFab = document.getElementById('chatFab');
    let allowed = [];
    let session = null;

    window.__CC_CONTEXT__ = {
      active_tab: null,
      geo: null,
      ads: null,
      campaigns: null
    };

    function ensureFrameSrc(frame) {
      const src = frame.getAttribute('data-src');
      if (src && (!frame.src || frame.src === 'about:blank' || frame.src.endsWith('about:blank'))) {
        frame.src = src;
      }
    }

    function setChatFabClosed() {
      chatFab.classList.remove('open');
      chatFab.setAttribute('aria-pressed', 'false');
      chatFab.innerHTML = '<img src="./assets/fashion-stylist.svg" alt="" width="64" height="64" />';
    }

    function setChatVisible(show) {
      chatFab.style.display = show ? '' : 'none';
      if (!show) {
        document.body.classList.remove('chat-open');
        setChatFabClosed();
      }
    }

    let pendingAction = null;

    function updateHint() {
      document.getElementById('chatCtxHint').textContent =
        'AURA · tab=' + window.__CC_CONTEXT__.active_tab +
        (window.__CC_CONTEXT__.geo ? ' · geo ready' : '') +
        (window.__CC_CONTEXT__.ads ? ' · ads ready' : '') +
        (window.__CC_CONTEXT__.campaigns ? ' · campaigns ready' : '');
    }

    function requestContext(frame) {
      try {
        if (!frame || !frame.contentWindow) return;
        if (frame.src && !frame.src.endsWith('about:blank')) {
          frame.contentWindow.postMessage({ type: 'cc-context-request' }, '*');
        }
      } catch (e) {
        console.error('[aura] postMessage failed', e);
      }
    }

    function refreshAllContext() {
      requestContext(tabs.geo);
      requestContext(tabs.ads);
      requestContext(tabs.campaigns);
      updateHint();
    }

    function sendAgentCommand(tab, command) {
      const frame = tabs[tab];
      if (!frame) return;
      ensureFrameSrc(frame);
      const fire = () => {
        try {
          frame.contentWindow.postMessage({
            type: 'cc-agent-command',
            command: command,
          }, '*');
        } catch (e) {
          console.error('[aura] command failed', tab, command, e);
        }
      };
      // Give iframe a tick to load if just activated
      setTimeout(fire, frame.contentDocument && frame.contentDocument.readyState === 'complete' ? 50 : 400);
    }

    function applyUiCommands(commands) {
      const list = Array.isArray(commands) ? commands : [];
      list.forEach((cmd) => {
        if (!cmd || typeof cmd !== 'object') return;
        const t = String(cmd.type || '');
        if (t === 'switch_tab') {
          activateTab(cmd.tab);
          return;
        }
        if (t === 'prefill_campaign') {
          if (cmd.context) {
            openCampaignWizard(cmd.context);
          } else {
            if (window.__CC_CONTEXT__.active_tab !== 'geo') activateTab('geo');
            sendAgentCommand('geo', { type: 'create_campaign_from_geo' });
          }
          return;
        }
        if (t === 'open_monitor') {
          openCampaignMonitor(cmd.campaign_id);
          return;
        }
        if (t === 'load_campaign') {
          openCampaignsTab(cmd.campaign_id, null, window.__CC_CONTEXT__.active_tab === 'style');
          return;
        }
        if (t === 'refresh_campaigns') {
          if (allowed.indexOf('campaigns') >= 0) sendAgentCommand('campaigns', { type: 'refresh_campaigns' });
          return;
        }
        if (t === 'track_job' || t === 'export_campaign') {
          if (allowed.indexOf('ads') < 0) return;
          if (window.__CC_CONTEXT__.active_tab !== 'ads') activateTab('ads');
          sendAgentCommand('ads', cmd);
          return;
        }
        if (t === 'request_upload') {
          appendBubble('assistant', 'Attach SKU images with the paperclip button below (JPEG, PNG or WebP).');
          return;
        }
        const tab = cmd.tab || (t === 'focus_pin' || t === 'run_brief' ? 'geo'
          : (t === 'run_campaign' || t === 'export_csv' || t === 'open_file_picker' ? 'ads'
            : (window.__CC_CONTEXT__.active_tab || 'geo')));
        if (t === 'set_filters' || t === 'reset_filters') {
          const target = cmd.tab || tab;
          if (target === 'geo' || target === 'ads') {
            if (window.__CC_CONTEXT__.active_tab !== target) activateTab(target);
            sendAgentCommand(target, cmd);
          }
          return;
        }
        if (t === 'focus_pin' || t === 'run_brief') {
          if (window.__CC_CONTEXT__.active_tab !== 'geo') activateTab('geo');
          sendAgentCommand('geo', cmd);
          return;
        }
        if (t === 'run_campaign' || t === 'export_csv' || t === 'open_file_picker') {
          if (window.__CC_CONTEXT__.active_tab !== 'ads') activateTab('ads');
          sendAgentCommand('ads', cmd);
          return;
        }
        // Fallback: send to active geo/ads tab
        if (tab === 'geo' || tab === 'ads') sendAgentCommand(tab, cmd);
      });
      setTimeout(refreshAllContext, 600);
    }

    function buildFilterContext() {
      const c = window.__CC_CONTEXT__ || {};
      const geoF = (c.geo && c.geo.filters) || {};
      const adsF = (c.ads && c.ads.filters) || {};
      const adsPins = adsF.pin_codes || adsF.pins || null;
      const geoPins = Array.isArray(geoF.pin) ? geoF.pin : (geoF.pin ? [geoF.pin] : null);
      return {
        active_tab: c.active_tab || null,
        pin_code: (geoPins && geoPins[0]) || (adsPins && adsPins[0]) || null,
        pin_codes: adsPins || geoPins,
        age_group: (Array.isArray(geoF.age) ? geoF.age[0] : geoF.age) || adsF.age_group || null,
        gender: (Array.isArray(geoF.gender) ? geoF.gender[0] : geoF.gender) || adsF.gender || null,
        rfm_segment: (Array.isArray(geoF.rfm) ? geoF.rfm[0] : geoF.rfm) || adsF.rfm_segment || null,
        brand: adsF.brand_name || (Array.isArray(geoF.brand) ? geoF.brand[0] : geoF.brand) || null,
        brand_name: adsF.brand_name || (session && session.brand_name) || null
      };
    }

    const AURA_GENERIC_ERROR = 'Something went wrong. Please try again.';

    function maskedErrorText(data) {
      const msg = data && data.error && typeof data.error.message === 'string' ? data.error.message : '';
      return msg || AURA_GENERIC_ERROR;
    }

    function appendConfirmBar(action) {
      if (!action || !action.token) return;
      const log = document.getElementById('chatLog');
      const box = document.createElement('div');
      box.className = 'chat-confirm-box';
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = action.label || 'Confirm action';
      const summary = document.createElement('div');
      summary.textContent = action.summary || '';
      const wrap = document.createElement('div');
      wrap.className = 'chat-confirm';
      const yes = document.createElement('button');
      yes.type = 'button';
      yes.textContent = 'Confirm';
      const no = document.createElement('button');
      no.type = 'button';
      no.className = 'secondary';
      no.textContent = 'Cancel';
      yes.addEventListener('click', () => {
        box.remove();
        pendingAction = null;
        sendAuraRequest({ message: '', confirm_token: action.token }, 'Confirmed: ' + (action.label || 'action'));
      });
      no.addEventListener('click', () => {
        pendingAction = null;
        box.remove();
        appendBubble('assistant', 'Cancelled. Nothing was changed.');
      });
      wrap.appendChild(yes);
      wrap.appendChild(no);
      box.appendChild(label);
      box.appendChild(summary);
      box.appendChild(wrap);
      log.appendChild(box);
      log.scrollTop = log.scrollHeight;
    }

    async function sendAuraRequest(payload, userEcho) {
      const input = document.getElementById('chatInput');
      const sendBtn = document.getElementById('chatSend');
      refreshAllContext();
      if (userEcho) appendBubble('user', userEcho);
      sendBtn.disabled = true;
      try {
        const res = await fetch('/v1/agent/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Accept: 'application/json',
            ...(window.SuffaiSession ? SuffaiSession.authHeaders() : {}),
          },
          body: JSON.stringify({
            context: window.__CC_CONTEXT__,
            filter_context: buildFilterContext(),
            ...payload,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) {
          if (data.request_id) console.info('[aura] failed request_id=', data.request_id);
          appendBubble('assistant', maskedErrorText(data), true);
          if (res.status === 401) setTimeout(() => SuffaiSession.logout(), 1500);
          return;
        }
        applyUiCommands(data.ui_commands || []);
        appendBubble('assistant', data.answer || 'Done.');
        pendingAction = data.pending_action || null;
        if (pendingAction) appendConfirmBar(pendingAction);
        if (data.attached_images === 0 && stagedFiles.length) {
          stagedFiles = [];
          renderStagedChips();
        }
      } catch (_) {
        appendBubble('assistant', 'Connection problem. Please check your network and try again.', true);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    function sendAuraMessage(message) {
      return sendAuraRequest({ message }, message);
    }

    let stagedFiles = [];

    function renderStagedChips() {
      const box = document.getElementById('chatChips');
      box.innerHTML = '';
      if (!stagedFiles.length) return;
      stagedFiles.forEach((name) => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.title = name;
        chip.textContent = name;
        box.appendChild(chip);
      });
      const clear = document.createElement('button');
      clear.type = 'button';
      clear.className = 'chip clear';
      clear.textContent = 'Clear';
      clear.addEventListener('click', clearStagedImages);
      box.appendChild(clear);
    }

    async function clearStagedImages() {
      try {
        await fetch('/v1/agent/uploads', {
          method: 'DELETE',
          headers: { Accept: 'application/json', ...(window.SuffaiSession ? SuffaiSession.authHeaders() : {}) },
        });
      } catch (_) { /* ignore */ }
      stagedFiles = [];
      renderStagedChips();
    }

    async function uploadChatImages(fileList) {
      const files = Array.from(fileList || []).filter(f => /^image\/(jpeg|png|webp)$/.test(f.type));
      if (!files.length) {
        appendBubble('assistant', 'Please attach JPEG, PNG or WebP images.', true);
        return;
      }
      const fd = new FormData();
      files.slice(0, 10).forEach(f => fd.append('files', f, f.name));
      const attach = document.getElementById('chatAttach');
      attach.disabled = true;
      appendBubble('user', 'Attached ' + files.length + ' image(s)');
      try {
        const res = await fetch('/v1/agent/uploads', {
          method: 'POST',
          headers: { Accept: 'application/json', ...(window.SuffaiSession ? SuffaiSession.authHeaders() : {}) },
          body: fd,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) {
          appendBubble('assistant', maskedErrorText(data), true);
          return;
        }
        stagedFiles = Array.isArray(data.files) ? data.files : [];
        renderStagedChips();
        appendBubble('assistant', stagedFiles.length + ' image(s) ready. Ask me to rank them for your audience.');
      } catch (_) {
        appendBubble('assistant', 'Connection problem. Please check your network and try again.', true);
      } finally {
        attach.disabled = false;
      }
    }

    document.getElementById('chatAttach').addEventListener('click', () => document.getElementById('chatFile').click());
    document.getElementById('chatFile').addEventListener('change', (e) => {
      uploadChatImages(e.target.files);
      e.target.value = '';
    });

    function activateTab(id) {
      if (allowed.indexOf(id) < 0) return;
      window.__CC_CONTEXT__.active_tab = id;
      document.querySelectorAll('.tab').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === id);
      });
      Object.entries(tabs).forEach(([key, frame]) => {
        const show = key === id;
        frame.classList.toggle('hidden', !show);
        if (show) ensureFrameSrc(frame);
      });
      const chatTab = id === 'geo' || id === 'ads' || id === 'campaigns';
      setChatVisible(chatTab);
      if (chatTab) refreshAllContext();
    }

    const CAMPAIGN_DRAFT_KEY = 'suffai_campaign_draft';

    function openCampaignWizard(context) {
      if (allowed.indexOf('ads') < 0) return;
      const ctx = context && typeof context === 'object' ? context : {};
      try {
        sessionStorage.setItem(CAMPAIGN_DRAFT_KEY, JSON.stringify(ctx));
      } catch (e) {
        console.error('[shell] draft save failed', e);
      }
      activateTab('ads');
      sendAgentCommand('ads', { type: 'prefill_campaign', context: ctx });
    }

    function openCampaignsTab(campaignId, sourceContext, background) {
      if (allowed.indexOf('campaigns') < 0) return;
      if (!background) activateTab('campaigns');
      if (campaignId) {
        sendAgentCommand('campaigns', { type: 'load_campaign', campaign_id: campaignId, source_context: sourceContext || null });
      }
    }

    function openCampaignMonitor(campaignId) {
      if (allowed.indexOf('style') < 0 || !campaignId) return;
      const frame = tabs.style;
      const url = './style_assistant.html?mode=campaign_preview&campaign_id=' + encodeURIComponent(campaignId);
      frame.src = url;
      activateTab('style');
    }

    window.addEventListener('message', (ev) => {
      const data = ev.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'cc-open-campaign') {
        openCampaignWizard(data.context);
        return;
      }
      if (data.type === 'cc-open-monitor') {
        openCampaignMonitor(data.campaign_id);
        return;
      }
      if (data.type === 'cc-open-campaigns') {
        openCampaignsTab(data.campaign_id, data.source_context);
        return;
      }
      if (data.type === 'cc-campaign-created') {
        if (allowed.indexOf('campaigns') >= 0 && tabs.campaigns.src && !tabs.campaigns.src.endsWith('about:blank')) {
          sendAgentCommand('campaigns', { type: 'refresh_campaigns' });
        }
        return;
      }
      if (data.type !== 'cc-context') return;
      if (data.source === 'geo') {
        window.__CC_CONTEXT__.geo = {
          filters: data.filters || {},
          summary: data.summary || {}
        };
      } else if (data.source === 'ads') {
        window.__CC_CONTEXT__.ads = {
          filters: data.filters || {},
          filters_label: data.filters_label || '',
          ranked: data.ranked || []
        };
      } else if (data.source === 'campaigns') {
        window.__CC_CONTEXT__.campaigns = {
          campaign_name: data.campaign_name || null,
          status: data.status || null
        };
      }
      updateHint();
    });

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => activateTab(btn.dataset.tab));
    });

    document.getElementById('btnLogout').addEventListener('click', () => {
      SuffaiSession.logout();
    });

    (async function bootShell() {
      const local = SuffaiSession.getSession();
      if (!local || !local.token) {
        location.replace('./login.html');
        return;
      }
      session = await SuffaiSession.fetchMe();
      if (!session) {
        location.replace('./login.html');
        return;
      }
      allowed = session.allowed_tabs || [];
      if (!allowed.length) {
        SuffaiSession.clearSession();
        location.replace('./login.html');
        return;
      }

      const label = session.display_name || session.username || session.role;
      const roleBit = session.role ? (' · ' + session.role) : '';
      document.getElementById('userLabel').textContent = label + roleBit;
      document.getElementById('shellSubtitle').textContent = allowed
        .map(t => ({ geo: 'Geo', ads: 'Ads Lab', campaigns: 'Campaigns', style: 'Style', admin: 'Admin' }[t] || t))
        .join(' · ');

      document.querySelectorAll('.tab').forEach(btn => {
        const ok = allowed.indexOf(btn.dataset.tab) >= 0;
        btn.hidden = !ok;
      });

      // Prefer hash / ?tab= if allowed, else first allowed (customer → style)
      const params = new URLSearchParams(location.search);
      const hashTab = (location.hash || '').replace(/^#/, '');
      const want = params.get('tab') || hashTab || allowed[0];
      const start = allowed.indexOf(want) >= 0 ? want : allowed[0];
      document.getElementById('shellTop').style.visibility = 'visible';
      if (start === 'style' && params.get('campaign_id')) {
        openCampaignMonitor(params.get('campaign_id'));
      } else if (start === 'campaigns' && params.get('campaign_id')) {
        openCampaignsTab(params.get('campaign_id'));
      } else {
        activateTab(start);
      }
    })();

    chatFab.addEventListener('click', () => {
      const open = document.body.classList.toggle('chat-open');
      chatFab.classList.toggle('open', open);
      chatFab.setAttribute('aria-pressed', open ? 'true' : 'false');
      if (open) {
        chatFab.textContent = '×';
        refreshAllContext();
        document.getElementById('chatInput').focus();
      } else {
        setChatFabClosed();
      }
    });

    function appendBubble(role, text, isError) {
      const el = document.createElement('div');
      el.className = 'chat-bubble ' + role + (isError ? ' error' : '');
      el.textContent = text;
      const log = document.getElementById('chatLog');
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    document.getElementById('chatForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const message = (input.value || '').trim();
      if (!message) return;
      input.value = '';
      await sendAuraMessage(message);
    });

    setTimeout(refreshAllContext, 1200);
  </script>
</body>
</html>
