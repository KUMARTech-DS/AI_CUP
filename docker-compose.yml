# Local GCP-parity stack (no Streamlit)
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENVIRONMENT: local
      WEB_ORIGIN: http://localhost:3000,http://localhost:8081
      DEMO_AUTH_ENABLED: "true"
      JWT_SECRET: local-dev-secret
      DATA_DIR: /app/data_offline
      DERIVED_DIR: /app/data_derived
    volumes:
      - ./data_derived:/app/data_derived

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    ports:
      - "8082:8080"
    environment:
      PORT: "8080"
      ENABLE_VERTEX: "false"
