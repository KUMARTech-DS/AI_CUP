# Local GCP-parity stack (no suffai-api — command_center is the BFF)
services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    ports:
      - "8082:8080"
    environment:
      PORT: "8080"
      ENABLE_VERTEX: "false"

  # web/ UI + /v1/metrics + /v1/ads-lab/* + /v1/chat
  command_center:
    build:
      context: .
      dockerfile: Dockerfile.command_center
    ports:
      - "8083:8080"
    environment:
      PORT: "8080"
      USE_BQ: "true"
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      BQ_DATASET: ${BQ_DATASET:-suffai_ops}
      GCS_IMAGE_BUCKET: ${GCS_IMAGE_BUCKET:-}
      EXTRACTION_URL: ${EXTRACTION_URL:-}
      SIMILARITY_URL: ${SIMILARITY_URL:-}
      CORS_ORIGINS: "*"

  similarity:
    build:
      context: .
      dockerfile: Dockerfile.similarity
    ports:
      - "8084:8080"
    environment:
      PORT: "8080"
      ENABLE_VERTEX: "false"
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GCS_IMAGE_BUCKET: ${GCS_IMAGE_BUCKET:-}
      DATABASE_URL: ${DATABASE_URL:-}
