# Build & push Cloud Run images (extraction + command center).
# suffai-api retired — BFF is suffai-command-center.
substitutions:
  _REGION: asia-south1
  _CC_SERVICE: suffai-command-center
  _WORKER_SERVICE: suffai-extraction

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_WORKER_SERVICE}:$SHORT_SHA", "-f", "Dockerfile.worker", "."]

  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_CC_SERVICE}:$SHORT_SHA", "-f", "Dockerfile.command_center", "."]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_WORKER_SERVICE}:$SHORT_SHA"]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_CC_SERVICE}:$SHORT_SHA"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WORKER_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_WORKER_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_CC_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_CC_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=1Gi

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_WORKER_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_CC_SERVICE}:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
